name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "iPhoneOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Logic tests (palette, tiles, manifest, keys)
        run: |
          clang -fobjc-arc -Wall -Werror -framework Foundation -framework CoreGraphics -framework Accelerate -framework ImageIO \
            -ISources Tests/AULogicTests.m Sources/Features/AUPalette.m Sources/Features/AUImage.m Sources/Core/AUManifest.m -o aura-tests
          ./aura-tests

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          brew install ldid make

      - name: Build Aura.dylib
        env:
          THEOS: ${{ runner.temp }}/theos
          AURA_MODELS_URL: ${{ secrets.AURA_MODELS_URL }}
        run: |
          test -n "$AURA_MODELS_URL" || { echo "::error::AURA_MODELS_URL secret is not set"; exit 1; }
          gmake -j4 FINALPACKAGE=1 AURA_VERSION="0.1.0-${GITHUB_SHA::7}" AURA_MODELS_URL="$AURA_MODELS_URL"

      - name: Check the dylib
        run: |
          otool -L .theos/obj/Aura.dylib
          ! otool -L .theos/obj/Aura.dylib | grep -qi substrate
          otool -l .theos/obj/Aura.dylib | grep -A2 LC_ID_DYLIB | grep -q /Library/MobileSubstrate/DynamicLibraries/Aura.dylib
          ls -la .theos/obj/Aura.dylib

      - name: Models on Core ML (download, checksum, compile, run)
        env:
          AURA_MODELS_URL: ${{ secrets.AURA_MODELS_URL }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install coremltools numpy pillow
          "$RUNNER_TEMP/venv/bin/python" scripts/check_models.py "$AURA_MODELS_URL"

      # The repository is public and so are its artifacts: the dylib carries the model server's address, so it is
      # uploaded encrypted with a key that only lives in the repository's secrets.
      - name: Encrypt the artifact
        env:
          KEY: ${{ secrets.AURA_ARTIFACT_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::AURA_ARTIFACT_KEY secret is not set"; exit 1; }
          mkdir -p out
          cp .theos/obj/Aura.dylib out/
          shasum -a 256 out/Aura.dylib
          tar -czf - -C out Aura.dylib | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -out aura.tar.gz.enc

      - uses: actions/upload-artifact@v4
        with:
          name: aura-dylib-encrypted
          path: aura.tar.gz.enc
          retention-days: 3
          if-no-files-found: error
